  # Reach, $30K pool, rules: https://reachclipping.com/Lacy
  # Pool payout needs 1,000,000 total approved views (MVR). One strike, no AI content, no logos,
  # >=50% audience in US/CA/AU/UK/NZ, submit within 30 min of posting.
  - name: reach-lacy
    streamer: Lacy
    channel_url: https://www.youtube.com/@LacyHimself   # US streamer (UCeoZXkaJDtdTHafgoZeDcAA); @Lacy is an unrelated Hungarian channel
    campaign_url: https://contentrewards.com/campaigns/4479e5e2-9a00-489e-8b0c-345834f37cc7
    platforms: [youtube, tiktok, instagram, x]   # campaign-allowed platforms (posts.md)
    layout: center         # IRL/stream: face-tracked crop; fit would show the overlays
    identity: lacy         # models/ref_lacy.npy (clipper identity build): track only Lacy's face, not the largest one
    crop_h: 0.92           # drop the bottom strip (viewer count with Twitch/YouTube icons, sub goal)
    top_pad: 160           # IRL camera faces sit at the very top: keep them below the top UI zone
    avoid: [[0.72, 0.0, 0.28, 0.26]]   # chat overlay top right (x, y, w, h fractions)
    name_fixes: {Lacey: Lacy}
    tags: [lacy, stream, clips]
    credit: "Credit: Lacy (https://www.youtube.com/@LacyHimself)"
    title_mention: Lacy
    hook_mention: Lacy      # campaign: caption/text overlay must mention Lacy
    required_text: "#Lacy"
    rank_notes: >-
      Reach campaign rules: Lacy must be the primary focus of the whole clip (not just the intro).
      Never portray Lacy in a negative light, no negative or false narrative, no drama/hate farming.
      English-speaking audience (US/UK/CA/AU/NZ). Prefer funny moments, memorable quotes and reactions.
      The hook text MUST contain the name "Lacy". Avoid moments where Japanese speech or Japanese
      signs/screen text carry the moment (no Japanese text may appear in captions or descriptions).
      Avoid moments dominated by brand logos or stream overlay graphics.

