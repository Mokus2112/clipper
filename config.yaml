# Clipper pipeline configuration.

paths:
  data: data          # jobs, renders, review queue
  secrets: secrets    # client_secret.json + token.json for the YouTube API
  fonts: fonts

fetch:
  max_height: 1080
  rate_limit: 25M     # yt-dlp --limit-rate; a 4 h 1080p VOD still downloads in ~7 min
  chat: true          # try to download YouTube live chat replay (used for highlight scoring)
  chat_timeout: 900   # seconds to wait for the live chat download after the video is done
  keep_source: false  # `run` deletes the VOD after rendering; clips and transcripts are kept

detect:
  candidates: 40      # how many loudness/chat peaks to keep as hints for the ranker
  spike_z: 2.0        # peaks at or above this score are marked as <<SPIKE>> in the transcript
  pre_roll: 25        # seconds before the peak included in a candidate window
  post_roll: 20       # seconds after the peak
  min_gap: 90         # minimum seconds between two candidate peaks
  baseline_window: 301  # rolling median window (s) for loudness baseline
  chat_weight: 1.0
  reaction_weight: 1.0  # YAMNet laughter/screaming/cheering
  reaction_scale: 4.0   # reaction probability 0..1 -> roughly z-score range
  skip_edges: 60      # ignore the first/last N seconds (intro/outro screens)

whisper:
  full_model: base    # fast pass over the whole VOD, used to find stories
  clip_model: medium  # word timestamps for the selected clips (captions); small was ~0.2 s off mid-speech
  chunk_sec: 600      # full pass works in chunks to keep memory flat
  language: null      # null = auto-detect
  threads: 4

rank:
  model: sonnet       # passed to `claude -p --model`
  clips_per_vod: 5
  content_check: true   # second LLM pass on the selected transcripts (mumble, sarcasm, no payoff, context, disputed claim)
  check_model: haiku
  min_score: 7        # drop clips the ranker scores below this (1-10); no clip is better than a weak clip

prescreen:               # cheap check of ranked candidates before transcribe/render; reasons in <job>/prescreen.json
  enabled: true
  fps: 1.0
  min_identity_ratio: 0.6      # identity sources: share of samples with the locked person
  max_multi_face_ratio: 0.4    # other sources: share of samples with 2+ faces
  max_cuts_per_40s: 10
  max_top_text_ratio: 0.15     # share of samples with OCR words in the top strip
  max_silence_ratio: 0.25
  silence_db: -70

clip:
  min_sec: 18
  max_sec: 50
  pad_start: 0.15
  pad_end: 0.5

render:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: medium
  loudnorm: true
  cold_open: true         # start with the payoff moment, then cut back to the setup
  cold_open_max: 2.5
  face_min_ratio: 0.5     # auto layout: face-crop only if a face is visible in >= 50% of sampled frames
  facecam_max_face: 0.12  # auto: a face narrower than 12% of the frame is treated as a facecam overlay...
  facecam_max_spread: 0.06  # ...if its centre moves less than this (fraction of frame) over the clip
  fit_zoom: 1.3           # fit layout: enlarge the centred frame and trim the sides a bit
  split_top_ratio: 0.365  # split layout: facecam 1080x700 on top
  track_face: true        # center layout: follow the face with EMA-smoothed crop instead of a static median
  push_in_rate: 0.04      # shots layout: push-in per shot, zoom 1.0 + 0.04/s (Badi: 0.02 was invisible) ...
  push_in_max: 1.20       # ... capped here, restarts at every camera cut
  track_alpha: 0.15       # EMA smoothing (lower = slower pan, less jitter)

captions:
  font: Montserrat ExtraBold
  size: 88
  outline: 8
  max_words: 3
  max_chunk_sec: 1.4
  uppercase: true
  color: "&H00FFFFFF"      # ASS BGR: white
  highlight: "&H0000E0FF"  # ASS BGR: brand yellow #FFE000
  y_center: 1260           # caption baseline in center layout (keeps clear of Shorts UI)
  y_split: 820             # caption position in split layout (just under the seam)
  y_shots: 1000            # shots layout fallback
  y_shots_duo: 1000        # shots layout, stacked duo: just under the seam
  y_shots_face: 1410       # shots layout, close-up: below the face, above the Shorts UI
  y_fit: 1400              # fit layout: below the centred frame, above the 420 px bottom UI zone (TikTok/Reels)
  pop: 1.0                 # 1.0 = no scale pop (Badi 2026-11-01: 1.12 looked jittery); word highlight colour stays

hook:
  enabled: true
  box: "&H0000E0FF"   # brand yellow box, black text
  seconds: 2.5
  size: 72
  y: 330
  y_duo: 312          # stacked duo: top of the box at the safe zone edge, off the speaker's head
  y_face: 1250        # shots layout close-ups: over the chest, clear of the forehead and the captions

music:
  threshold: 0.3   # YAMNet music score above which a second counts as "music"
  max_ratio: 0.5   # skip clips where music is heard in more than half the seconds (Content ID / blocked Shorts)

memes:
  max_per_clip: 0           # Badi 2026-11-01: memes on hold, no effects on clips (was 2)
  claude_model: haiku       # fast + cheap for effect labelling
  shorts_per_source: 12     # Shorts to fetch per channel per refresh
  sources: []               # optional pinned channels (always analysed)
  discover_channels: 4      # channel search: top channels by total views across these queries
  search_queries:
    - streamer funny moments shorts
    - twitch clips shorts
    - kai cenat stream clip
    - ishowspeed stream clip

telegram:
  notify: true           # `run` sends new clips to Telegram for review and manual upload
  env_file: /Users/badi/Codee/.env   # TELEGRAM_BOT_TOKEN + ALLOWED_CHAT_ID

upload:
  # The videos.insert docs (checked 2026-10-21) say unverified projects are no longer locked to private.
  # Verify once with a test upload before switching to public.
  privacy: private       # Badi 2026-11-01: always upload private first, he publishes manually (clipper publish <id>)
  category_id: "20"      # 20 = Gaming, 24 = Entertainment
  daily_limit: 3
  description_footer: ""

# One entry per permitted source (e.g. a Whop Content Rewards campaign).
# layout: auto   = face crop when a face is clearly visible, otherwise fit (default)
#         fit    = whole 16:9 frame centred over a blurred background (IRL camera footage)
#         center = face-tracked 9:16 crop (IRL / just chatting)
#         split  = facecam on top, gameplay below; facecam is [x, y, w, h] as fractions of the source frame
sources:
  - name: example
    streamer: Example Streamer
    channel_url: https://www.youtube.com/@example
    campaign_url: ""
    layout: auto
    facecam: null
    tags: [streamer, clips, funny]
    credit: "Credit: Example Streamer (https://www.youtube.com/@example)"
    required_text: ""     # tag/mention/link the campaign brief requires in every post

  - name: test-speed      # pipeline test only, not uploaded
    streamer: IShowSpeed
    channel_url: https://www.youtube.com/@IShowSpeed
    campaign_url: ""
    layout: auto
    facecam: null
    tags: [ishowspeed, speed, stream]

    credit: "Credit: IShowSpeed (https://www.youtube.com/@IShowSpeed)"

