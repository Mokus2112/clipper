[project]
name = "clipper"
version = "0.1.0"
description = "Automated streamer clip pipeline for YouTube Shorts"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=4.10,<5",
    "pyyaml>=6.0.3",
]

[project.scripts]
clipper = "clipper.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
